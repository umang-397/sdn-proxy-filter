<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1040" height="560" fill="#ffffff"/>

  <!-- application layer frame -->
  <rect x="300" y="40" width="660" height="300" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="960" y="64" text-anchor="end" font-size="13" fill="#1d4ed8" font-weight="600">application layer</text>

  <!-- clients -->
  <rect x="40" y="150" width="170" height="130" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="125" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">clients</text>
  <text x="125" y="208" text-anchor="middle" font-size="13" fill="#334155">c1 10.0.0.1</text>
  <text x="125" y="232" text-anchor="middle" font-size="13" fill="#334155">c2 10.0.0.2</text>
  <text x="125" y="256" text-anchor="middle" font-size="13" fill="#334155">c3 10.0.0.3</text>

  <!-- switch -->
  <rect x="300" y="175" width="150" height="90" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="375" y="207" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">OVS switch s1</text>
  <text x="375" y="231" text-anchor="middle" font-size="12" fill="#854d0e">OpenFlow 1.3</text>
  <text x="375" y="250" text-anchor="middle" font-size="12" fill="#854d0e">priority 0 default drop</text>

  <!-- proxy -->
  <rect x="520" y="115" width="190" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="615" y="147" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">TCP proxy</text>
  <text x="615" y="171" text-anchor="middle" font-size="12.5" fill="#166534">10.0.0.10:8080</text>
  <text x="615" y="192" text-anchor="middle" font-size="12" fill="#166534">policy + logging</text>

  <!-- services -->
  <rect x="790" y="85" width="150" height="75" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.6"/>
  <text x="865" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">web</text>
  <text x="865" y="137" text-anchor="middle" font-size="12" fill="#9d174d">10.0.0.21:8001</text>

  <rect x="790" y="205" width="150" height="75" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.6"/>
  <text x="865" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">files</text>
  <text x="865" y="257" text-anchor="middle" font-size="12" fill="#9d174d">10.0.0.22:8002</text>

  <!-- controller -->
  <rect x="470" y="420" width="220" height="95" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="580" y="451" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Ryu controller</text>
  <text x="580" y="474" text-anchor="middle" font-size="12.5" fill="#5b21b6">127.0.0.1:6653</text>
  <text x="580" y="494" text-anchor="middle" font-size="12" fill="#5b21b6">dynamic drops (priority 200)</text>

  <!-- enforcement-point labels -->
  <text x="615" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">ENFORCEMENT POINT 1: application policy</text>
  <text x="375" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#a16207">ENFORCEMENT POINT 2: network path</text>

  <!-- arrows -->
  <line x1="210" y1="200" x2="292" y2="207" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="190" text-anchor="middle" font-size="11.5" fill="#334155">TCP 8080</text>

  <line x1="450" y1="200" x2="512" y2="176" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="474" y="174" text-anchor="middle" font-size="11.5" fill="#334155">allowed</text>

  <line x1="710" y1="150" x2="782" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="744" y="126" text-anchor="middle" font-size="11.5" fill="#334155">GET</text>

  <line x1="710" y1="185" x2="782" y2="228" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="742" y="222" text-anchor="middle" font-size="11.5" fill="#334155">GET</text>

  <!-- control socket -->
  <line x1="600" y1="215" x2="580" y2="412" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowDash)"/>
  <text x="624" y="330" font-size="11.5" fill="#6d28d9">unix socket</text>
  <text x="624" y="346" font-size="11.5" fill="#6d28d9">/tmp/sdn_ctrl.sock</text>

  <!-- OpenFlow -->
  <line x1="470" y1="440" x2="382" y2="272" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowDash)"/>
  <text x="377" y="380" text-anchor="end" font-size="11.5" fill="#6d28d9">OpenFlow 1.3</text>
  <text x="377" y="396" text-anchor="end" font-size="11.5" fill="#6d28d9">flow rules</text>

  <!-- bypass mark -->
  <line x1="125" y1="280" x2="850" y2="250" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowRed)" opacity="0.85"/>
  <text x="500" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">direct client -&gt; service bypass: dropped by the priority-0 rule</text>
  <line x1="468" y1="296" x2="532" y2="296" stroke="#dc2626" stroke-width="3"/>
</svg>
